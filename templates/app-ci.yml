# SPDX-License-Identifier: GPL-3.0-or-later WITH LicenseRef-cardkit-ads-exception
# Template CI for a cardkit-based game app. Copy to <game>/.github/workflows/ci.yml and replace
# the <game> placeholders. Games with extra modules (an online :net, a :server) append their
# test/build tasks where marked; the 500 repo's ci.yml is the worked example including the
# server-image and server-deploy jobs this template deliberately omits.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive   # pulls in the cardkit submodule

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Static analysis (detekt + CPD)
        run: ./gradlew qualityCheck

      # Games with more jvm modules (e.g. an online :net) append their jvmTest tasks here.
      - name: Unit tests (engine + ai + shared) and lint
        run: ./gradlew :engine:jvmTest :ai:jvmTest :shared:testDebugUnitTest lint

      - name: Coverage verification (engine + ai)
        run: ./gradlew :engine:koverVerify :ai:koverVerify

      - name: Assemble both flavors (debug)
        run: ./gradlew assembleFossDebug assemblePlayDebug

      - name: Build web distribution (wasmJs)
        run: ./gradlew :web:wasmJsBrowserDistribution

      # E2E smoke of the production wasm artifact: served under a /<game>/ prefix (the Pages
      # subpath), driven with Playwright against the runner's Chrome (WasmGC-capable).
      - name: Web E2E (Playwright)
        working-directory: web/e2e
        run: |
          npm ci
          npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/e2e/playwright-report
            web/e2e/test-results
          if-no-files-found: ignore

      - name: Upload quality reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: quality-reports
          path: |
            **/build/reports/detekt/
            **/build/reports/cpd/
          if-no-files-found: ignore

      - name: Verify FOSS build has no proprietary deps
        run: |
          ./gradlew :app:dependencies --configuration fossReleaseRuntimeClasspath > foss-deps.txt
          if grep -Eq 'com\.google\.android\.gms|com\.android\.billingclient|firebase|cardkit-monetization-play' foss-deps.txt; then
            echo "::error::FOSS build graph contains a proprietary dependency"; exit 1
          fi

  # On-device (emulator) integration suite, so the Android side gates merges like the web e2e
  # does. Games whose connected tests need extra services (500 boots a dev-mode game server here
  # for its online tests) add those steps before the emulator step.
  android-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Connected tests (emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          # Phone-sized screen: the runner's default AVD is small enough that below-the-fold
          # content (settings-dialog rows, buttons) fails assertIsDisplayed/click.
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -no-snapshot
          disable-animations: true
          script: ./gradlew :app:connectedFossDebugAndroidTest

      - name: Upload connected-test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: connected-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      # Signing secrets (configure in repo settings):
      #   KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD
      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Build release artifacts
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:bundlePlayRelease :app:assembleFossRelease

      # Publishing happens in publish-release, behind the verify-reproducible gate below.
      - name: Upload FOSS APK for verification and publishing
        uses: actions/upload-artifact@v7
        with:
          name: foss-release-apk
          path: app/build/outputs/apk/foss/release/app-foss-release.apk
          if-no-files-found: error

      # The play AAB is for the Play Console, not for sideloading: expose it as a private
      # workflow artifact (Actions -> run -> Artifacts) rather than on the public release.
      - name: Upload play AAB as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: play-release-aab
          path: app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error

  # Reproducibility gate: rebuild the FOSS APK on a fresh runner and require it to match the
  # signed APK byte-for-byte before anything is published. The rebuild is deliberately different
  # in shape from the release build — full clone (what F-Droid's buildserver does, vs the shallow
  # release checkout; exercises a GIT_COMMIT --short=8 pin if the build stamps one) and no Gradle
  # build cache (restored cache entries would let the "independent" rebuild reuse the release
  # job's outputs and mask nondeterminism). apksigcopier compare is the same check fdroidserver
  # runs against Binaries: — so if this job is green, F-Droid can reproduce the published APK.
  verify-reproducible:
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      # No gradle/actions/setup-gradle here — see the job comment.

      - name: Rebuild FOSS APK (unsigned, no build cache)
        run: ./gradlew --no-build-cache :app:assembleFossRelease

      - name: Download signed APK
        uses: actions/download-artifact@v8
        with:
          name: foss-release-apk
          path: signed

      - name: Compare rebuild to signed APK (signature-aware)
        run: |
          pipx install apksigcopier
          export PATH="$ANDROID_HOME/build-tools/36.0.0:$PATH"   # apksigcopier shells out to apksigner
          sha256sum signed/app-foss-release.apk app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          apksigcopier compare signed/app-foss-release.apk \
            --unsigned app/build/outputs/apk/foss/release/app-foss-release-unsigned.apk
          echo "reproducible: rebuild matches the signed APK"

  publish-release:
    needs: verify-reproducible
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the GitHub release and upload the APK
    steps:
      - name: Download verified APK
        uses: actions/download-artifact@v8
        with:
          name: foss-release-apk

      - name: Publish GitHub release (FOSS APK)
        uses: softprops/action-gh-release@v3
        with:
          files: app-foss-release.apk

  # The playable web build (Kotlin/Wasm) goes to GitHub Pages on the same v* tags as the
  # Android release, so the hosted game tracks releases rather than every push to main.
  # One-time repo setting: Settings -> Pages -> Source = "GitHub Actions".
  deploy-web:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      pages: write      # deploy to GitHub Pages
      id-token: write   # OIDC token for the pages deployment
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      # settings.gradle.kts configures the Android modules even for :web tasks.
      - uses: android-actions/setup-android@v4
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Build web distribution
        run: ./gradlew :web:wasmJsBrowserDistribution

      # Actions-sourced Pages deployments skip Jekyll anyway; this is belt-and-braces in case
      # the Pages source is ever switched back to a branch.
      - name: Disable Jekyll
        run: touch web/build/dist/wasmJs/productionExecutable/.nojekyll

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/build/dist/wasmJs/productionExecutable
      - id: deployment
        uses: actions/deploy-pages@v5
